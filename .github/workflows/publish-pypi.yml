          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/langchain-tollwarden/pyproject.toml integrations/langchain-tollwarden/src/langchain_tollwarden/__init__.py
          git diff --cached --quiet && exit 0
          git commit -m "release(langchain): langchain-tollwarden v${{ steps.bump.outputs.version }}"
