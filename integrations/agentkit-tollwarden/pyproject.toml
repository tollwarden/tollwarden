[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentkit-tollwarden"
version = "0.1.1"
description = "TollWarden payment security for Coinbase AgentKit: a scan-before-you-pay action provider for x402 payments, with prompt-injection provenance and signed verdicts. Non-custodial."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TollWarden", email = "contact@tollwarden.com" }]
keywords = ["coinbase", "agentkit", "x402", "payments", "security", "ai-agents", "prompt-injection", "usdc", "base"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["tollwarden>=0.3.0", "coinbase-agentkit>=0.1"]

[project.urls]
Homepage = "https://tollwarden.com"
Repository = "https://github.com/tollwarden/tollwarden"
Documentation = "https://github.com/tollwarden/tollwarden/tree/main/integrations/agentkit-tollwarden"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit_tollwarden"]
