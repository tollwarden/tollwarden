[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemo-tollwarden"
version = "0.1.1"
description = "TollWarden payment security for the NVIDIA NeMo Agent Toolkit: scan x402 payments before settling, with prompt-injection provenance and signed verdicts. Registers scan / reputation / report functions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TollWarden", email = "contact@tollwarden.com" }]
keywords = ["nemo-agent-toolkit", "nvidia", "nat", "x402", "payments", "security", "ai-agents", "prompt-injection", "usdc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["tollwarden>=0.3.0", "nvidia-nat>=1.1"]

# NeMo Agent Toolkit discovers plugins through this entry-point group. The
# value is the module the toolkit imports on init; importing it runs the
# @register_function decorators. The loader scans both "nat.components" (the
# current convention used by in-tree packages) and the legacy "nat.plugins";
# we use "nat.components" to match the toolkit's own packages.
[project.entry-points."nat.components"]
nemo_tollwarden = "nemo_tollwarden.register"

[project.urls]
Homepage = "https://tollwarden.com"
Repository = "https://github.com/tollwarden/tollwarden"
Documentation = "https://github.com/tollwarden/tollwarden/tree/main/integrations/nemo-tollwarden"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_tollwarden"]
